spring.application.name=reservas-service
server.port=8082

spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.servlet.UserDetailsServiceAutoConfiguration

spring.config.import=optional:file:.env[.properties]

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jpa.show-sql=true

# Cognito valida el JWT via este issuer (Spring Security descarga las llaves publicas solo, via JWKS)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.${AWS_REGION}.amazonaws.com/${COGNITO_USER_POOL_ID}

# Topologia RabbitMQ (igual que ms-rabbit-admin)
hotel.messaging.dlx=hotel.dlx
hotel.messaging.exchanges.eventos=hotel.eventos
hotel.messaging.exchanges.documentos=hotel.documentos
hotel.messaging.queues.notificaciones=q.notificaciones
hotel.messaging.queues.tickets=q.tickets
hotel.messaging.queues.documentos=q.documentos
hotel.messaging.routing.notificaciones[0]=usuario.registrado
hotel.messaging.routing.notificaciones[1]=reserva.#
hotel.messaging.routing.tickets[0]=reserva.creada
hotel.messaging.routing.documentos[0]=comprobante

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

# Retencion y limpieza de las colas principales
hotel.messaging.retencion.max-length=10000
hotel.messaging.retencion.ttl-ms=86400000

# Nombres de las DLQ que consume DlqConsumer
hotel.messaging.dlq.notificaciones=q.notificaciones.dlq
hotel.messaging.dlq.tickets=q.tickets.dlq
hotel.messaging.dlq.documentos=q.documentos.dlq
hotel.messaging.dlq.consumir=${DLQ_CONSUMIR:true}

# Confirmacion manual y reintentos acotados
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=5000ms

# === CONFIGURACIÓN DE CONEXIÓN A POSTGRESQL (NEON) ===
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración básica de JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# ============================================================
# === Kafka (EP5) - convive con RabbitMQ, no lo reemplaza ===
# ============================================================
# KAFKA_ENABLED=false apaga productores y consumidores Kafka (RabbitMQ sigue funcionando igual)
hotel.kafka.enabled=${KAFKA_ENABLED:true}

# Topicos (se crean con ms-kafka-admin: POST /topics/inicializar) y consumer groups de este servicio
hotel.kafka.topics.reservas=hotel.reservas.eventos
hotel.kafka.topics.usuarios=hotel.usuarios.eventos
hotel.kafka.groups.ocupacion=reservas-ocupacion
hotel.kafka.groups.usuarios=reservas-usuarios-cache

# Brokers: en AWS, la IP privada de la EC2 de Kafka con los puertos 9092, 9093 y 9094
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
spring.kafka.client-id=ms-reservas

# Productor: clave String, valor JSON (DTO). acks=all + idempotencia = sin perdidas ni duplicados por reintento
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=5
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.spring.json.add.type.headers=false
# Si Kafka esta caido, send() no bloquea la peticion HTTP mas de 3 segundos
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=15000
spring.kafka.producer.properties.request.timeout.ms=5000

# Consumidor: ErrorHandlingDeserializer evita que un JSON roto bloquee la particion
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.hotelboutique.reservas.kafka
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.properties.session.timeout.ms=15000
# El offset se confirma despues de procesar cada registro
spring.kafka.listener.ack-mode=record
# Un hilo por consumidor; con 3 particiones se podrian subir hasta 3
spring.kafka.listener.concurrency=1
