spring.application.name=reservas-service
server.port=8082

spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.servlet.UserDetailsServiceAutoConfiguration

spring.config.import=optional:file:.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Database configuration (lee del .env)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Entra ID configuration - lee del .env
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/${ENTRA_TENANT_ID:e05a6798-9387-460a-beca-a08056fe1ca2}/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=${ENTRA_API_CLIENT_ID:ecc9edec-2abe-4cec-9a71-f60b2826c339}