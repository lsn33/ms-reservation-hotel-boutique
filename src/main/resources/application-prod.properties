# IMPORTANTE: este servicio necesita SU PROPIA base de datos (principio de microservicios:
# cada servicio es dueno de sus propios datos). No reutilices la misma base del auth-service.
# Crea un segundo proyecto (o una segunda base dentro del mismo proyecto) en Neon y reemplaza esto.
spring.datasource.url=${DB_URL:jdbc:postgresql://TU_HOST_NEON_RESERVAS/TU_BASE?sslmode=require}
spring.datasource.username=${DB_USER:tu_usuario}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
